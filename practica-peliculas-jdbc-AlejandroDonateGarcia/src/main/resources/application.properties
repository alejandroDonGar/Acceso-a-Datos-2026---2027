# Ruta relativa: arrancar siempre desde la carpeta del pom.xml
spring.datasource.url=jdbc:sqlite:data/peliculas.sqlite3
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite solo admite un escritor a la vez: una conexion en el pool
spring.datasource.hikari.maximum-pool-size=1
# La tabla ya existe: Spring no crea el esquema
spring.sql.init.mode=never
# Perfil por defecto jdbc, para que "mvn spring-boot:run" arranque sin parametros
# (se puede cambiar con -Dspring-boot.run.profiles=otro)
spring.profiles.default=jdbc
